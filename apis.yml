aid: dework
name: Dework
description: >-
  Dework is a Web3-native task-management and bounty platform for DAOs and
  decentralized teams. Organizations create bounties, projects, and task boards;
  contributors build an on-chain reputation profile, claim or apply to tasks,
  and get paid in the DAO's own token or stablecoins from supported wallets
  (Gnosis/Safe, MetaMask, Phantom, WalletConnect). Dework offers token- and
  Discord-role gating, two-way Discord and GitHub sync, Notion and Coordinape
  integrations, batch payments, reputation staking, roadmaps, and leaderboards.
  It aggregates bounties and grants from hundreds of DAOs. The app is backed by
  an Apollo GraphQL API at api.dework.xyz; product documentation lives on
  GitBook. Backed by Paradigm.
